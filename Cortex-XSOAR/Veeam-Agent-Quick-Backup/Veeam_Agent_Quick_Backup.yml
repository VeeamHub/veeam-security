    taskid: 8b07ad07-e59a-4db8-8ae4-4170179f2b08
    type: regular
    task:
      id: 8b07ad07-e59a-4db8-8ae4-4170179f2b08
      version: -1
      name: Set Session ID for Polling
      description: Copies the session ID returned by "Get Session by Job ID" into
        its own context key (SessionIdForPolling). Veeam.VBR.general_api_request accumulates
        one entry per call made during this playbook run (Get Agent Info, then this
        call). ".[-1]" selects only the most recent entry - this call's own result
        - so GenericPolling and the later Get Session task get exactly one ID (the
        session), not the agent ID mixed in as well.
      scriptName: Set
      type: regular
      iscommand: false
      brand: ""
    nexttasks:
      '#none#':
      - "11"
    scriptarguments:
      append:
        simple: "false"
      key:
        simple: SessionIdForPolling
      value:
        simple: ${Veeam.VBR.general_api_request.[2].data.[0].id}
